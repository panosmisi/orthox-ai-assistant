<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OrthoX Medical AI{% endblock %}</title>
  <script>
    (function () {
      try {
        if (localStorage.getItem("orthox-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/css/app.css?v=20260727-preflight-v2">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark">
        <img src="/static/img/orthox-logo.jpg" alt="" aria-hidden="true">
      </span>
      <span class="brand-copy">
        <span class="brand-name">OrthoX</span>
        <span class="brand-subtitle">Medical AI</span>
      </span>
    </a>
    <nav class="nav">
      <a href="/review" class="{% if request.url.path.startswith('/review') or request.url.path.startswith('/upload') or request.url.path.startswith('/case') %}active{% endif %}">Review X-ray</a>
      <a href="/demo" class="{% if request.url.path.startswith('/demo') %}active{% endif %}">Demo cases</a>
      <a href="/problem-description" class="{% if request.url.path.startswith('/problem-description') %}active{% endif %}">Problem Description</a>
      <a href="/about" class="{% if request.url.path.startswith('/about') %}active{% endif %}">Method</a>
      <a href="/safety" class="{% if request.url.path.startswith('/safety') %}active{% endif %}">Safety</a>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">
      <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-dot"></span></span>
      <span data-theme-toggle-label>Dark</span>
    </button>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    Academic prototype. Not a diagnosis or treatment plan. Human clinical review is required.
  </footer>
  <script src="/static/js/app.js?v=20260727-preflight-v2"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
